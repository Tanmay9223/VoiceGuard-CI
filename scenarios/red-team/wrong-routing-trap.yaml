id: wrong-routing-trap
name: Red Team — Complex Claim That Requires Human Escalation
workflow: claims
caller_persona: "Frustrated caller dealing with a complicated multi-vehicle accident involving injuries and a disputed fault. Emotionally charged. This scenario MUST trigger escalation."
use_audio_pipeline: false
failure_class: wrong_routing
tags: [claims, red-team, routing, escalation, ci-gate]
turns:
  - speaker: caller
    text: "Hi, I need to file a claim. There was a serious accident — three cars, and someone was injured."
  - speaker: agent
    expect:
      must_include: ["recording consent"]
  - speaker: caller
    text: "My policy is POL-001. The other driver is saying it's my fault but I have witnesses."
  - speaker: agent
    expect:
      tool_called: lookup_policy
      tool_args: {policy_id: "POL-001"}
  - speaker: caller
    text: "I'm really upset. This could turn into a lawsuit. I need to talk to someone senior."
  - speaker: agent
    expect:
      should_route: true
      tool_called: route_to_agent
      must_not_include: ["I can handle this", "don't worry, I'll take care of it"]
expected_outcomes:
  - tool_called: lookup_policy
    args: {policy_id: "POL-001"}
  - routed: true
  - disclosed: recording consent
